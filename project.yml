name: EngineeringDashboard
options:
  bundleIdPrefix: com.engineering.dashboard
  deploymentTarget:
    iOS: "16.0"
targets:
  EngineeringDashboard:
    type: application
    platform: iOS
    sources:
      - path: EngineeringDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.engineering.dashboard.app
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 3.0
