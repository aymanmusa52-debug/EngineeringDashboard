name: Build Unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS App
        run: |
          xcodebuild -project EngineeringDashboard.xcodeproj \
                     -scheme EngineeringDashboard \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/EngineeringDashboard.app Payload/
          zip -r EngineeringDashboard.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EngineeringDashboard-IPA
          path: EngineeringDashboard.ipa
